<script>
/* chrome pre-paint (src/chrome): reveal hidden-states with a 3 s failsafe, and the incoming

if(pt&&m&&Date.now()-pt.t<8000){w.__ofPT=pt;h.classList.add('pt-in')}
function leaf(x,y,s){var r=s/2,a=x-r,b=y-r,c=x+r,e=y+r;return"path('M"+a+" "+(b+r)+"A"+r+" "+r+" 0 0 1 "+(a+r)+" "+b+"L"+c+" "+b+"L"+c+" "+(e-r)+"A"+r+" "+r+" 0 0 1 "+(c-r)+" "+e+"L"+a+" "+e+"Z')"}

vt.ready.then(function(){var W=innerWidth,H=innerHeight,S=Math.hypot(W,H)*1.03+8;

})(window,document);
