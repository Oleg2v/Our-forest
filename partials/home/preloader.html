<!-- home/preloader "טבעות שנים" (tree rings) — owned by the hero agent. Behaviour: src/sections/home/preloader.ts.
     Paints and starts drawing at first paint, before any JS: the critical CSS is inline here and the counter is a
     CSS @property animation. JS only decides when to open the ring window (the hero photo is loaded underneath).
     Skipped on a repeat visit in the same session, after an in-site page transition, on deep links (#map …)
     and with reduced motion.
     Failsafe: if JS never takes over, the layer fades away by itself after 5 s (and never exists without JS). -->
<script>
(function(h){try{if(sessionStorage.getItem('of:preloader')==='1'||window.__ofPT||location.hash.length>1)h.classList.add('pl-skip')}catch(e){}
if(!h.classList.contains('pl-skip')&&h.classList.contains('motion'))h.classList.add('pl-on')})(document.documentElement);
</script>

<style>
@property --pl-n { syntax: '<integer>'; inherits: false; initial-value: 0; }
.preloader {

  contain: strict; -webkit-user-select: none; user-select: none;
}
html.pl-on .preloader { display: block; animation: pl-failsafe .6s ease 5s forwards; }
html.pl-on .preloader.is-js { animation: none; }
@media (prefers-reduced-motion: reduce) { html.pl-on .preloader { display: none; } }
.preloader__disc {
  /* 460 px, or 42vmin on tall screens (≥ 1100 px high: 605 px at 2560 × 1440, where 460 px read as a third of the screen) */
  position: absolute; left: 50%; top: 47%; width: min(70vmin, 80vw, max(460px, 42vmin)); aspect-ratio: 1;
  translate: -50% -50%; overflow: visible; transform-origin: 48.25% 52.25%;
  animation: pl-turn 2.2s cubic-bezier(.22,1,.36,1) both;
}
.preloader__disc path { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
.pl-r {
  --o: .78; stroke-width: 1.1; opacity: var(--o); stroke-dasharray: 1 1; stroke-dashoffset: 1;
  animation: pl-draw calc(.34s + .25s * var(--s)) cubic-bezier(.45,.05,.25,1) calc(var(--i) * 40ms + 40ms) forwards;
}
.pl-r--late { --o: 1; stroke-width: 1.55; }
.pl-r--cambium { --o: .55; stroke-width: .9; }
.pl-r--bark { --o: 1; stroke-width: 2.3; }
.pl-r--crack { --o: .7; stroke-width: .9; animation-duration: .38s; animation-delay: .84s; }
.pl-pith { fill: currentColor; transform-box: fill-box; transform-origin: center; animation: pl-pith .6s cubic-bezier(.22,1,.36,1) both; }

.preloader__count {
  counter-reset: pl var(--pl-n); min-width: 3ch; text-align: center;
  font-family: 'Frank Ruhl Libre', 'David Libre', 'Times New Roman', serif; font-weight: 300;
  font-size: clamp(40px, 5vw, 56px); line-height: 1; letter-spacing: -.01em;
  font-variant-numeric: lining-nums tabular-nums;
  animation: pl-count 1.2s cubic-bezier(.4,.06,.3,1) .06s forwards;
}
.preloader__count::after { content: counter(pl); }
.preloader__label {
  font-family: 'Heebo', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 500;
  letter-spacing: .06em; color: #626630;
}
/* landscape phones / short windows: the disc fills the height — the counter moves beside it, not onto the bark */
@media (max-height: 520px) and (orientation: landscape) {
  .preloader__disc { top: 50%; width: min(66vmin, 80vw, 460px); }
  .preloader__meta {

}

@keyframes pl-pith { from { transform: scale(0); } }
@keyframes pl-turn { from { rotate: 14deg; scale: .9; } }
@keyframes pl-meta { from { opacity: 0; transform: translateY(10px); } }
@keyframes pl-count { to { --pl-n: 100; } }
@keyframes pl-failsafe { to { opacity: 0; visibility: hidden; } }
