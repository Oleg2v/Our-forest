<!-- home/contact — section 8 "צרו קשר". Owned by the "lower" agent.
     Script: src/sections/home/contact.ts (+ contact.css). A demo form: real validation (Hebrew),
     nothing is sent anywhere; track('generate_lead'). After sending, a seed falls into the ground
     and sprouts (line art). Without JS the form posts nowhere (action-less, novalidate is set by JS). -->
<section class="contact" id="contact" data-bg="cream" aria-labelledby="contact-title">
  <div class="contact__grid container">
    <div class="contact__aside">
      <h2 class="contact__title" id="contact-title" data-he="contact.title" data-reveal="lines">צרו קשר</h2>
      <p class="contact__sub" data-he="contact.subtitle" data-reveal="lines">רוצים לשמוע עוד, להתייעץ או להצטרף לפרויקט?</p>
      <p class="contact__text" data-he="contact.text" data-reveal="fade">מלאו פרטים ונחזור אליכם בהקדם.</p>
      <div class="contact__direct" data-reveal="fade">
        <a class="btn btn--outline contact__wa" href="https://wa.me/972500000000" data-wa target="_blank" rel="noopener">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 11.4a7.9 7.9 0 0 1-11.5 7.1L4 20l1.4-4.2A7.9 7.9 0 1 1 20 11.4Z"/><path d="M8.6 11.6h.01M12 11.6h.01M15.4 11.6h.01"/></svg>
          <span data-he="cta.whatsapp">וואטסאפ</span>
        </a>
        <a class="contact__place" href="https://www.google.com/maps/search/?api=1&amp;query=%D7%9E%D7%95%D7%A9%D7%91%20%D7%A4%D7%93%D7%99%D7%94" target="_blank" rel="noopener">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="10" r="3"/><path d="M12 21c-4.4-4.6-6.6-8.3-6.6-11a6.6 6.6 0 0 1 13.2 0c0 2.7-2.2 6.4-6.6 11Z"/></svg>
          <span><span data-he="contact.address">מושב פדיה</span><span class="visually-hidden"> (מפה, נפתח בלשונית חדשה)</span></span>
        </a>
      </div>
    </div>

    <div class="contact__panel" data-contact-panel data-reveal="fade">
      <form class="contact__form" data-contact-form aria-labelledby="contact-title">
        <div class="contact__row">
          <div class="contact__field">
            <label for="cf-name"><span data-he="contact.form.name">שם מלא</span><span class="contact__star" aria-hidden="true">*</span></label>
            <input id="cf-name" name="name" type="text" autocomplete="name" required aria-required="true" enterkeyhint="next">
            <p class="contact__err" id="cf-name-err" hidden></p>
          </div>
          <div class="contact__field">
            <label for="cf-phone"><span data-he="contact.form.phone">טלפון</span><span class="contact__star" aria-hidden="true">*</span></label>
            <input id="cf-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" required aria-required="true" enterkeyhint="next">
            <p class="contact__err" id="cf-phone-err" hidden></p>
          </div>
        </div>
        <div class="contact__row">
          <div class="contact__field">
            <label for="cf-email"><span data-he="contact.form.email">אימייל</span></label>
            <input id="cf-email" name="email" type="email" inputmode="email" autocomplete="email" dir="ltr" enterkeyhint="next">
            <p class="contact__err" id="cf-email-err" hidden></p>
          </div>
          <div class="contact__field">
            <label for="cf-interest" data-he="contact.interest.label">מה מעניין אתכם?</label>
            <div class="contact__select">
              <select id="cf-interest" name="interest" data-contact-interest>
                <option value="">בחרו נושא</option>
                <option>נטיעת עץ</option>
                <option>ספסל או פינה</option>
                <option>סדנה</option>
                <option>יום גיבוש</option>
                <option>אירוע</option>
                <option>אחר</option>
              </select>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 9.5 6 6 6-6"/></svg>
            </div>
          </div>
        </div>
        <div class="contact__field">
          <label for="cf-message" data-he="contact.form.message">הודעה / נושא הפניה</label>
          <textarea id="cf-message" name="message" rows="3"></textarea>
        </div>

        <div class="contact__consent">
          <input class="contact__box" id="cf-consent" name="consent" type="checkbox" required aria-required="true">
          <label class="contact__consent-label" for="cf-consent">
            <span class="contact__tick" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" focusable="false"><path d="m5.5 12.5 4 4 9-9"/></svg></span>
            <span>בשליחת הטופס אני מאשר/ת את <a href="/legal/privacy">מדיניות הפרטיות</a> והשימוש בפרטים לצורך יצירת קשר.</span>
          </label>
          <p class="contact__err" id="cf-consent-err" hidden></p>
        </div>

        <div class="contact__submit">
          <button class="btn btn--lg contact__send" type="submit" data-magnetic>
            <span data-he="contact.form.submit">שלח</span>
            <svg class="icon contact__seed-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4.5c3 0 5 3.4 5 7.5s-2 7.5-5 7.5-5-3.4-5-7.5 2-7.5 5-7.5Z"/><path d="M11 8.5c1.3 2.3 1.3 4.7 0 7"/></svg>
          </button>
          <p class="contact__note"><span class="contact__star" aria-hidden="true">*</span> שדות חובה</p>
        </div>
      </form>

      <div class="contact__done" data-contact-done hidden tabindex="-1" aria-labelledby="contact-done-title">
        <svg class="contact__art" viewBox="0 0 320 180" aria-hidden="true" focusable="false">
          <defs><clipPath id="contact-above"><rect x="-20" y="-160" width="360" height="311"/></clipPath></defs>
          <path class="contact__ground" data-art="ground" d="M8 150c40-3 78 2 118-1s74-4 108-1 52 3 78 1"/>
          <g class="contact__specks" data-art="specks"><path d="M112 163h6"/><path d="M140 171h4"/><path d="M182 165h8"/><path d="M206 173h4"/><path d="M94 172h3"/><path d="M226 162h5"/></g>
          <g clip-path="url(#contact-above)"><g class="contact__seed" data-art="seed" transform="translate(160 -30)"><path d="M0 -8.5c3.6 0 6 3.8 6 8.5s-2.4 8.5-6 8.5-6-3.8-6-8.5 2.4-8.5 6-8.5Z"/><path d="M-1.4 -4.6c1.4 2.8 1.4 6.4 0 9.2"/></g></g>
          <path class="contact__mound" data-art="mound" d="M143 150c5-7 29-7 34 0"/>
          <path class="contact__stem" data-art="stem" d="M160 149c0-15-2.5-28 1.5-46"/>
          <path class="contact__leaf" data-art="leaf" d="M161.2 116c1.8-14 12-22.5 29.5-23-1.5 14.5-12 22.6-29.5 23Z"/>
          <path class="contact__leaf" data-art="leaf" d="M160.6 128c-2-11.5-10.6-18-23.6-18 1 11.6 9.6 18 23.6 18Z"/>
          <path class="contact__leaf" data-art="bud" d="M161.5 103c-.3-4.6 1.8-8.2 5.6-9.6"/>
        </svg>
        <h3 class="contact__done-title" id="contact-done-title">תודה<span data-contact-name></span></h3>
        <p class="contact__done-text">קיבלנו את הפנייה ונחזור אליכם בהקדם.</p>
        <p class="contact__done-demo">זהו אתר הדגמה, ולכן הפרטים לא נשלחו לשום מקום.</p>
        <div class="contact__done-actions">
          <a class="btn btn--outline btn--sm" href="https://wa.me/972500000000" data-wa target="_blank" rel="noopener">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 11.4a7.9 7.9 0 0 1-11.5 7.1L4 20l1.4-4.2A7.9 7.9 0 1 1 20 11.4Z"/><path d="M8.6 11.6h.01M12 11.6h.01M15.4 11.6h.01"/></svg>
            <span data-he="cta.whatsapp">וואטסאפ</span>
          </a>
          <button class="contact__again" type="button" data-contact-again>שולחים פנייה נוספת</button>
        </div>
      </div>
      <p class="contact__status visually-hidden" role="status" aria-live="polite" data-contact-status></p>
    </div>
  </div>
</section>
